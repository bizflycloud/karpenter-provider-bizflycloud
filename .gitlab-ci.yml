stages:
  - test
  - build
  - update-addon

variables:
  GO_VERSION: "1.22"
  REGISTRY: cr-hn-1.bizflycloud.vn/31ff9581861a4d0ea4df5e7dda0f665d
  IMAGE_NAME: karpenter-provider-bizflycloud
  ADDON_REPO: git@gitlab.bizflycloud.vn:bke/bizflycloud-kubernetes-add-ons.git

# ─── Stage: test ─────────────────────────────────────────────────────────────

test:build:
  stage: test
  image: golang:${GO_VERSION}-alpine
  before_script:
    - apk add --no-cache git make
  script:
    - go build ./...
    - go vet ./...
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# ─── Stage: build ────────────────────────────────────────────────────────────

build:docker:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$REGISTRY"
  script:
    - docker build -t "$REGISTRY/$IMAGE_NAME:$CI_COMMIT_TAG" .
    - docker push "$REGISTRY/$IMAGE_NAME:$CI_COMMIT_TAG"
    # Also tag as latest for convenience
    - docker tag "$REGISTRY/$IMAGE_NAME:$CI_COMMIT_TAG" "$REGISTRY/$IMAGE_NAME:latest"
    - docker push "$REGISTRY/$IMAGE_NAME:latest"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'

# ─── Stage: update-addon ─────────────────────────────────────────────────────

update-addon:
  stage: update-addon
  image: alpine:3.19
  before_script:
    - apk add --no-cache git openssh-client
    - eval $(ssh-agent -s)
    - echo "$ADDON_REPO_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan gitlab.bizflycloud.vn >> ~/.ssh/known_hosts
    - git config --global user.email "ci@bizflycloud.vn"
    - git config --global user.name "BKE CI Bot"
  script:
    - git clone "$ADDON_REPO" addon-repo
    - cd addon-repo
    # Update image tag in karpenter values.yml
    - sed -i "s|tag:.*|tag: $CI_COMMIT_TAG|g" karpenter/helm/values.yaml
    # Update version in INFORMATION.yaml if it exists
    - |
      if [ -f karpenter/INFORMATION.yaml ]; then
        sed -i "s|version:.*|version: $CI_COMMIT_TAG|g" karpenter/INFORMATION.yaml
      fi
    - git add karpenter/helm/values.yaml karpenter/INFORMATION.yaml 2>/dev/null || true
    - git diff --cached --quiet || git commit -m "chore: bump karpenter to $CI_COMMIT_TAG"
    - git push
    - echo "Pushed update to addon repo. Create MR manually for review."
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'
  # Allow manual trigger to skip auto-push if needed
  when: on_success
