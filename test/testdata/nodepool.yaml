apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: test-default
spec:
  limits:
    cpu: "10"
    memory: 20Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
    budgets:
      - nodes: "1"
        reasons:
          - Empty
          - Underutilized
  template:
    spec:
      nodeClassRef:
        group: karpenter.bizflycloud.com
        kind: BizflyCloudNodeClass
        name: test-default
      expireAfter: 720h
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: karpenter.bizflycloud.com/node-category
          operator: In
          values:
            - basic
            - premium
